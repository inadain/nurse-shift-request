<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>シフト希望申請 掲示用QR</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
    width: 210mm;
    height: 297mm;
    background: linear-gradient(160deg, #134E4A 0%, #0D9488 60%, #99F6E4 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .poster {
    background: #fff;
    border-radius: 20px;
    width: 168mm;
    padding: 20mm 16mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8mm;
    box-shadow: 0 8px 40px rgba(0,0,0,.25);
  }
  .logo-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3mm;
  }
  .org-name {
    font-size: 11pt;
    color: #6b7280;
    letter-spacing: .1em;
  }
  .title {
    font-size: 22pt;
    font-weight: 900;
    color: #134E4A;
    text-align: center;
    line-height: 1.3;
    letter-spacing: .02em;
  }
  .subtitle {
    font-size: 10pt;
    color: #6b7280;
    text-align: center;
  }
  .divider {
    width: 60mm;
    height: 2px;
    background: linear-gradient(90deg, transparent, #0D9488, transparent);
  }
  .qr-container {
    padding: 6mm;
    border: 3px solid #0D9488;
    border-radius: 16px;
    background: #fff;
  }
  #qr-main canvas, #qr-main img {
    width: 200px !important;
    height: 200px !important;
  }
  .steps {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 4mm;
  }
  .step {
    display: flex;
    align-items: flex-start;
    gap: 4mm;
  }
  .step-num {
    width: 7mm;
    height: 7mm;
    border-radius: 50%;
    background: #0D9488;
    color: #fff;
    font-size: 10pt;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .step-text {
    font-size: 11pt;
    color: #1a1a2e;
    line-height: 1.5;
  }
  .step-text strong { color: #134E4A; }
  .deadline-box {
    width: 100%;
    background: #ECFDF5;
    border: 2px solid #6EE7B7;
    border-radius: 10px;
    padding: 5mm 6mm;
    text-align: center;
  }
  .deadline-label { font-size: 9pt; color: #6b7280; margin-bottom: 1mm; }
  .deadline-text { font-size: 16pt; font-weight: 900; color: #065F46; }
  .url-text {
    font-size: 8pt;
    color: #9ca3af;
    word-break: break-all;
    text-align: center;
  }
  @media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style>
</head>
<body>
<div class="poster">
  <div class="logo-area">
    <div class="org-name">メディケアビレッジ訪問看護ステーション</div>
    <div class="title">シフト希望申請は<br>こちらから</div>
    <div class="subtitle">スマートフォンでQRコードを読み取ってください</div>
  </div>

  <div class="divider"></div>

  <div class="qr-container">
    <div id="qr-main"></div>
  </div>

  <div class="steps">
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-text">QRコードを読み取り、サイトを開く</div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-text"><strong>職員ID</strong>と<strong>パスワード</strong>でログイン<br><span style="font-size:9pt;color:#6b7280">（別途配布のログインカードを確認）</span></div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-text">カレンダーの日付をタップして<br><strong>日勤 ／ 休み ／ 有給</strong> を選択して登録</div>
    </div>
  </div>

  <div class="deadline-box">
    <div class="deadline-label">申請締め切り</div>
    <div class="deadline-text">毎月 15日まで</div>
  </div>

  <div class="url-text">https://inadain.github.io/nurse-shift-request/</div>
</div>

<script>
new QRCode(document.getElementById("qr-main"), {
  text: "https://inadain.github.io/nurse-shift-request/",
  width: 200, height: 200,
  colorDark: "#134E4A", colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.M
});
</script>
</body>
</html>
