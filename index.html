<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>シフト希望申請 — 引っ越しました</title>
<meta http-equiv="refresh" content="0; url=https://shift.inadaiin.com/">
<link rel="canonical" href="https://shift.inadaiin.com/">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;
  background:#FAF7F4;color:#332F2C;display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;line-height:1.9}
.box{background:#fff;border:1px solid #EAE2DC;border-radius:16px;padding:34px 30px;
  max-width:400px;text-align:center;box-shadow:0 10px 30px -12px rgba(60,84,132,.22)}
h1{font-size:19px;color:#3C5484;margin-bottom:12px}
p{font-size:13.5px;color:#7A6E67;margin-bottom:18px}
a.go{display:block;background:#D86C54;color:#fff;text-decoration:none;font-weight:700;
  padding:13px;border-radius:11px;font-size:15px;letter-spacing:.04em}
.url{font-family:monospace;font-size:12px;color:#3C5484;margin-top:14px;word-break:break-all}
</style>
</head>
<body>
<div class="box">
  <h1>新しいアドレスに移りました</h1>
  <p>そのままお待ちいただくと移動します。<br>
     移らないときは下を押してください。</p>
  <a class="go" href="https://shift.inadaiin.com/">シフト希望申請をひらく</a>
  <div class="url">https://shift.inadaiin.com/</div>
</div>
<script>location.replace("https://shift.inadaiin.com/");</script>
</body>
</html>
