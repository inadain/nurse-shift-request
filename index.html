<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="シフト希望申請">
<title>シフト希望申請</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0D9488;--teal-dark:#0F766E;--navy:#134E4A;--navy-dark:#0D3330;
  --bg:#F0FDF4;--card:#fff;--text:#1A1A2E;--muted:#6B7280;--border:#E5E7EB;
  --nikkin:#2563EB;--yasumi:#6B7280;--yukyu:#10B981;
  --r:12px;--shadow:0 2px 16px rgba(0,0,0,.08)
}
body{font-family:-apple-system,'Hiragino Sans','Yu Gothic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}

/* Loading */
#page-loading{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:var(--muted)}
.spinner{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Form */
.page-center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#0D9488 0%,#134E4A 100%)}
.white-card{background:#fff;border-radius:20px;padding:36px 28px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.card-logo{text-align:center;margin-bottom:28px}
.card-logo h1{font-size:19px;font-weight:700;margin-bottom:4px}
.card-logo p{font-size:13px;color:var(--muted)}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.4px}
.fg input,.fg select,.fg textarea{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:10px;font-size:16px;color:var(--text);background:#fff;outline:none;-webkit-appearance:none;transition:border-color .2s}
.fg input:focus,.fg select:focus{border-color:var(--teal)}
.fg textarea{resize:vertical;min-height:80px}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;text-align:center;transition:all .2s;-webkit-appearance:none}
.btn-primary{background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:#fff}
.btn-primary:active{opacity:.85;transform:scale(.98)}
.btn-outline{background:transparent;border:2px solid var(--border);color:var(--text)}
.btn-sm{display:inline-block;width:auto;padding:7px 14px;font-size:13px}
.btn-danger{background:#EF4444;color:#fff}
.err-box{background:#FEF2F2;border:1px solid #FECACA;color:#EF4444;border-radius:8px;padding:11px 14px;font-size:13px;margin-bottom:14px;display:none}

/* Header */
.app-header{color:#fff;padding:14px 18px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.app-header.teal-hdr{background:linear-gradient(135deg,var(--teal),var(--teal-dark))}
.app-header.navy-hdr{background:linear-gradient(135deg,var(--navy),var(--navy-dark))}
.hdr-inner{display:flex;align-items:center;justify-content:space-between;max-width:820px;margin:0 auto}
.hdr-title{font-size:16px;font-weight:700}
.hdr-sub{font-size:11px;opacity:.8;margin-top:2px}
.btn-logout{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}

/* Tab */
.tab-nav{background:#fff;border-bottom:1px solid var(--border);display:flex;position:sticky;top:56px;z-index:99}
.tab-btn{flex:1;padding:11px 4px;background:none;border:none;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s}
.tab-btn.active{color:var(--teal);border-bottom-color:var(--teal)}

/* Main */
.main{max-width:820px;margin:0 auto;padding:16px 14px}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.card-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-hdr h2{font-size:15px;font-weight:700}
.card-body{padding:18px}

/* Month nav */
.month-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px}
.month-nav h2{font-size:19px;font-weight:700}
.month-nav-sub{font-size:12px;color:var(--muted);margin-bottom:2px}
.mnav-btn{background:var(--bg);border:none;border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Calendar */
.cal-wrap{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-hdr{padding:9px 0;text-align:center;font-size:11px;font-weight:600;color:var(--muted);background:#F9FAFB;border-bottom:1px solid var(--border)}
.cal-hdr:first-child{color:#EF4444}
.cal-hdr:last-child{color:#3B82F6}
.cal-cell{min-height:64px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:5px 4px;cursor:pointer;transition:background .15s;position:relative}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell.empty{background:#F9FAFB;cursor:default}
.cal-cell:not(.empty):active{background:#F0FDF4}
.day-num{font-size:12px;font-weight:600;display:block;margin-bottom:3px}
.cal-cell.sun .day-num{color:#EF4444}
.cal-cell.sat .day-num{color:#3B82F6}
.cal-cell.today{background:#ECFDF5}
.cal-cell.today .day-num{color:var(--teal);font-weight:800}
.type-chip{display:block;border-radius:4px;padding:3px 4px;font-size:10px;font-weight:700;text-align:center;color:#fff;margin-bottom:2px}
.chip-nikkin{background:var(--nikkin)}
.chip-yasumi{background:var(--yasumi)}
.chip-yukyu{background:var(--yukyu)}

/* Legend */
.legend{display:flex;flex-wrap:wrap;gap:10px;padding:10px 14px;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;font-size:12px}
.leg-item{display:flex;align-items:center;gap:6px}
.leg-dot{width:14px;height:14px;border-radius:3px}
.emp-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}

/* Status Summary */
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum-card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:12px;text-align:center}
.sum-num{font-size:24px;font-weight:700}
.sum-lbl{font-size:11px;color:var(--muted);margin-top:2px}
.sum-nikkin .sum-num{color:var(--nikkin)}
.sum-yasumi .sum-num{color:var(--yasumi)}
.sum-yukyu .sum-num{color:var(--yukyu)}

/* Deadline banner */
.deadline-banner{background:#FEF3C7;border:1px solid #FCD34D;border-radius:8px;padding:10px 14px;font-size:13px;color:#92400E;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.deadline-ok{background:#ECFDF5;border-color:#6EE7B7;color:#065F46}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:999;padding:0}
.modal-box{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:80vh;overflow:hidden;display:flex;flex-direction:column;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-hdr{padding:18px 20px 14px;border-bottom:1px solid var(--border)}
.modal-hdr h3{font-size:17px;font-weight:700}
.modal-hdr p{font-size:12px;color:var(--muted);margin-top:3px}
.modal-body{padding:16px 20px;overflow-y:auto;flex:1}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px}
.modal-foot .btn{flex:1}

/* Type select buttons */
.type-sel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.type-sel-btn{padding:14px 8px;border:2px solid var(--border);border-radius:12px;background:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;text-align:center}
.type-sel-btn.sel-nikkin.active{background:var(--nikkin);border-color:var(--nikkin);color:#fff}
.type-sel-btn.sel-yasumi.active{background:var(--yasumi);border-color:var(--yasumi);color:#fff}
.type-sel-btn.sel-yukyu.active{background:var(--yukyu);border-color:var(--yukyu);color:#fff}
.type-sel-btn:not(.active):hover{border-color:var(--teal)}
.type-sel-btn:disabled{opacity:.45;cursor:not-allowed;background:#F3F4F6}
.type-sel-btn:disabled:hover{border-color:var(--border)}

/* Emp table */
.emp-table{width:100%;border-collapse:collapse;font-size:13px}
.emp-table th{padding:8px 10px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);border-bottom:2px solid var(--border)}
.emp-table td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
.emp-table tr:last-child td{border-bottom:none}

/* Add form */
.add-form{background:#F9FAFB;border-radius:10px;padding:16px;margin-top:12px}
.add-form h3{font-size:14px;font-weight:700;margin-bottom:12px}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:380px){.fg-row{grid-template-columns:1fr}}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:9999;animation:fadeInUp .3s ease;white-space:nowrap}
@keyframes fadeInUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>

<!-- Loading -->
<div id="page-loading">
  <div class="spinner"></div>
  <p>読み込み中...</p>
</div>

<!-- Setup -->
<div id="page-setup" class="hidden page-center">
  <div class="white-card">
    <div class="card-logo">
      <div style="font-size:36px;margin-bottom:8px">🏥</div>
      <h1>シフト希望申請</h1>
      <p>初回セットアップ</p>
    </div>
    <div id="setup-err" class="err-box"></div>
    <div class="fg"><label>管理者ID</label><input id="s-id" type="text" placeholder="例：vadmin" autocapitalize="none"></div>
    <div class="fg"><label>管理者氏名</label><input id="s-name" type="text" placeholder="例：稲田崇志"></div>
    <div class="fg"><label>パスワード（4文字以上）</label><input id="s-pw" type="password" placeholder="パスワード"></div>
    <button class="btn btn-primary" onclick="setupAdmin()">管理者アカウントを作成</button>
  </div>
</div>

<!-- Login -->
<div id="page-login" class="hidden page-center">
  <div class="white-card">
    <div class="card-logo">
      <div style="font-size:36px;margin-bottom:8px">🏥</div>
      <h1>シフト希望申請</h1>
      <p>医療法人いなだ医院　メディケアビレッジ</p>
    </div>
    <div id="login-err" class="err-box"></div>
    <div class="fg"><label>職員ID</label><input id="l-id" type="text" placeholder="職員IDを入力" autocapitalize="none"></div>
    <div class="fg"><label>パスワード</label><input id="l-pw" type="password" placeholder="パスワード"></div>
    <button class="btn btn-primary" onclick="login()">ログイン</button>
  </div>
</div>

<!-- Employee Page -->
<div id="page-employee" class="hidden">
  <div class="app-header teal-hdr">
    <div class="hdr-inner">
      <div><div class="hdr-title" id="emp-hdr-title">シフト希望申請</div><div class="hdr-sub" id="emp-hdr-sub"></div></div>
      <button class="btn-logout" onclick="logout()">ログアウト</button>
    </div>
  </div>
  <div class="main">
    <div class="month-nav">
      <div><div class="month-nav-sub" style="font-size:11px;color:var(--muted)">来月の希望申請</div><h2 id="emp-month-label"></h2></div>
    </div>
    <div id="deadline-banner" class="deadline-banner">
      <span>⏰</span><span id="deadline-text"></span>
    </div>
    <div class="summary-grid">
      <div class="sum-card sum-nikkin"><div class="sum-num" id="cnt-nikkin">0</div><div class="sum-lbl">日勤</div></div>
      <div class="sum-card sum-yasumi"><div class="sum-num" id="cnt-yasumi">0</div><div class="sum-lbl">休み<span id="cnt-yasumi-max" style="opacity:.65"></span></div></div>
      <div class="sum-card sum-yukyu"><div class="sum-num" id="cnt-yukyu">0</div><div class="sum-lbl">有給</div></div>
    </div>
    <div id="kibou-note" style="margin:0 0 12px;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.6;background:#F3F4F6;color:#4B5563"></div>
    <div id="emp-calendar" class="cal-wrap"></div>
    <div class="card">
      <div class="card-hdr"><h2>特記事項・コメント</h2></div>
      <div class="card-body">
        <textarea id="emp-note" placeholder="シフトに関する連絡事項があれば入力してください" style="width:100%;border:2px solid var(--border);border-radius:8px;padding:10px;font-size:14px;resize:vertical;min-height:80px"></textarea>
        <button class="btn btn-outline" style="margin-top:8px" onclick="saveNote()">コメントを保存</button>
      </div>
    </div>
  </div>
</div>

<!-- Admin Page -->
<div id="page-admin" class="hidden">
  <div class="app-header navy-hdr">
    <div class="hdr-inner">
      <div><div class="hdr-title" id="admin-hdr-title">管理者ダッシュボード</div><div class="hdr-sub" id="admin-hdr-sub"></div></div>
      <button class="btn-logout" onclick="logout()">ログアウト</button>
    </div>
  </div>
  <div class="tab-nav">
    <button class="tab-btn active" id="tab-cal" onclick="switchTab('cal')">📅 カレンダー</button>
    <button class="tab-btn" id="tab-emp" onclick="switchTab('emp')">👥 職員管理</button>
    <button class="tab-btn" id="tab-account" onclick="switchTab('account')">🔑 設定</button>
  </div>
  <div class="main">
    <!-- Calendar tab -->
    <div id="content-cal">
      <div class="month-nav">
        <button class="mnav-btn" onclick="changeMonth(-1)">‹</button>
        <h2 id="admin-month-label"></h2>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="mnav-btn" onclick="changeMonth(1)">›</button>
          <button class="btn btn-outline btn-sm" onclick="printMonthlySummary()" style="padding:7px 14px;font-size:13px;font-weight:600;border-radius:8px;border:1.5px solid var(--border);background:#fff;cursor:pointer;white-space:nowrap">🖨 印刷</button>
        </div>
      </div>
      <div class="legend" id="admin-legend"></div>
      <div id="admin-calendar" class="cal-wrap"></div>
      <div class="card" style="margin-top:14px">
        <div class="card-hdr"><h2>特記事項・コメント一覧</h2></div>
        <div id="admin-notes-list" class="card-body" style="font-size:13px;color:#374151">
          <span style="color:var(--muted)">コメントはありません</span>
        </div>
      </div>
    </div>
    <!-- Employee tab -->
    <div id="content-emp" class="hidden">
      <div class="card">
        <div class="card-hdr">
          <h2>職員一覧</h2>
          <button class="btn btn-primary btn-sm" onclick="toggleAddForm()">＋ 追加</button>
        </div>
        <div id="emp-table-wrap" style="overflow-x:auto"></div>
        <div id="add-emp-form" class="add-form hidden" style="margin:0 16px 16px">
          <h3>新規職員を追加</h3>
          <div class="fg-row">
            <div class="fg"><label>職員ID（V + 3桁）</label><input id="ne-id" type="text" placeholder="職員IDを入力" autocapitalize="none"></div>
            <div class="fg"><label>氏名</label><input id="ne-name" type="text" placeholder="例：兼信 真理"></div>
          </div>
          <div class="fg"><label>パスワード</label><input id="ne-pw" type="password" placeholder="4文字以上"></div>
          <div style="display:flex;gap:10px">
            <button class="btn btn-primary" style="flex:1" onclick="addEmployee()">追加する</button>
            <button class="btn btn-outline" style="flex:1" onclick="toggleAddForm()">キャンセル</button>
          </div>
        </div>
      </div>
    </div>
    <!-- Account tab -->
    <div id="content-account" class="hidden">
      <div class="card">
        <div class="card-hdr"><h2>管理者パスワード変更</h2></div>
        <div class="card-body">
          <div class="fg"><label>現在のパスワード</label><input id="adm-pw-cur" type="password"></div>
          <div class="fg"><label>新しいパスワード</label><input id="adm-pw-new" type="password"></div>
          <div class="fg"><label>新しいパスワード（確認）</label><input id="adm-pw-new2" type="password"></div>
          <div id="adm-pw-err" style="color:#EF4444;font-size:13px;display:none;margin-bottom:10px"></div>
          <button class="btn btn-primary" onclick="changeAdminPassword()">変更する</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="hidden modal-bg" onclick="bgClose(event)">
  <div class="modal-box" id="modal-box"></div>
</div>

<script>
const CONFIG = {
  SUPABASE_URL: 'https://cywfriqqwaxaiackitxu.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5d2ZyaXFxd2F4YWlhY2tpdHh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MDU5NjcsImV4cCI6MjEwMjA4MTk2N30.pJlwfsfeKfuOXO0319JnPcLWgQoD6ZByKGD0wHrNIUM',
  DEADLINE_DAY: 15,
  SYSTEM_PREFIX: 'V'
};

const JA_DOW = ['日','月','火','水','木','金','土'];
// 希望休（「休み」）は月2日まで。3日目以降は管理者への連絡が必要（2026-09-03 決定）。
// 有給と日勤（出勤希望）はこの上限の対象外。
const KIBOU_MAX = 2;
const TYPE_COLOR = { '日勤': '#2563EB', '休み': '#6B7280', '有給': '#10B981' };
const TYPE_CHIP  = { '日勤': 'chip-nikkin', '休み': 'chip-yasumi', '有給': 'chip-yukyu' };
const COLORS = ['#E53E3E','#D69E2E','#38A169','#3182CE','#805AD5','#DD6B20','#319795','#E53E3E'];

const S = {
  sb: null, user: null,
  hash: null,      // ログイン中だけメモリに置く本人確認用のハッシュ（保存はしない）
  myNote: '',
  employees: [], allReqs: {}, allNotes: {},
  myReqs: {},
  reqYear: null, reqMonth: null,
  adminYear: null, adminMonth: null,
  addFormOpen: false
};

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function showPage(id) {
  ['page-loading','page-setup','page-login','page-employee','page-admin'].forEach(p => {
    document.getElementById(p).classList.toggle('hidden', p !== id);
  });
}

function toast(msg, dur = 2000) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), dur);
}

function openModal(html) {
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal() { document.getElementById('modal').classList.add('hidden'); }
function bgClose(e) { if (e.target.id === 'modal') closeModal(); }

function isDeadlinePassed() {
  return new Date().getDate() > CONFIG.DEADLINE_DAY;
}

function getReqMonthInfo() {
  const now = new Date();
  if (isDeadlinePassed()) {
    return { year: now.getMonth() === 11 ? now.getFullYear()+1 : now.getFullYear(), month: now.getMonth() === 11 ? 1 : now.getMonth()+2 };
  }
  return { year: now.getMonth() === 11 ? now.getFullYear()+1 : now.getFullYear(), month: now.getMonth() === 11 ? 1 : now.getMonth()+2 };
}

// ── Init ──────────────────────────────────
window.addEventListener('load', async () => {
  S.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  // 表を直接読まず、データベース側の関数に判定させる
  const { data: needSetup } = await S.sb.rpc('nurse_needs_setup');
  if (needSetup) { showPage('page-setup'); return; }
  showPage('page-login');
});

// ── Setup ─────────────────────────────────
async function setupAdmin() {
  const id = document.getElementById('s-id').value.trim().toUpperCase();
  const name = document.getElementById('s-name').value.trim();
  const pw = document.getElementById('s-pw').value;
  const err = document.getElementById('setup-err');
  err.style.display = 'none';
  if (!id || !name || pw.length < 4) { err.textContent = 'すべての項目を入力してください（パスワード4文字以上）'; err.style.display = 'block'; return; }
  if (!id.startsWith(CONFIG.SYSTEM_PREFIX)) { err.textContent = `IDは ${CONFIG.SYSTEM_PREFIX} から始まる必要があります`; err.style.display = 'block'; return; }
  const hash = await sha256(pw);
  const { data: res, error } = await S.sb.rpc('nurse_create_first_admin',
    { p_id: id, p_hash: hash, p_name: name });
  if (error || res !== 'ok') {
    err.textContent = res === 'already' ? '管理者はすでに登録されています'
                    : 'エラー: ' + (error?.message || '登録できませんでした');
    err.style.display = 'block'; return;
  }
  toast('管理者アカウントを作成しました');
  showPage('page-login');
}

// ── Login ─────────────────────────────────
async function login() {
  const id = document.getElementById('l-id').value.trim().toUpperCase();
  const pw = document.getElementById('l-pw').value;
  const err = document.getElementById('login-err');
  err.style.display = 'none';
  if (!id || !pw) { err.textContent = 'IDとパスワードを入力してください'; err.style.display = 'block'; return; }
  const hash = await sha256(pw);
  const { data } = await S.sb.rpc('nurse_login', { p_id: id, p_hash: hash });
  if (!data) { err.textContent = 'IDまたはパスワードが正しくありません'; err.style.display = 'block'; return; }
  S.user = data;
  S.hash = hash;   // このあとの操作で本人確認に使う。画面を閉じると消える
  if (S.user.is_admin) await showAdminView();
  else await showEmployeeView();
}

function logout() {
  S.user = null; S.hash = null; S.allReqs = {}; S.allNotes = {}; S.myReqs = {};
  showPage('page-login');
}

// ── Employee View ──────────────────────────
async function showEmployeeView() {
  showPage('page-employee');
  // 見出しは所属の事業所に合わせる（訪問看護・サ高住・デイ など）
  document.getElementById('emp-hdr-title').textContent =
    `${S.user.facility || ''} シフト希望申請`.trim();
  document.getElementById('emp-hdr-sub').textContent = S.user.name;
  const { year, month } = getReqMonthInfo();
  S.reqYear = year; S.reqMonth = month;
  document.getElementById('emp-month-label').textContent = `${year}年${month}月`;

  // Deadline banner
  const now = new Date();
  const banner = document.getElementById('deadline-banner');
  const txt = document.getElementById('deadline-text');
  if (isDeadlinePassed()) {
    txt.textContent = '今月の締め切り（15日）は過ぎています。申請は変更できません。';
    banner.className = 'deadline-banner';
  } else {
    const remaining = CONFIG.DEADLINE_DAY - now.getDate();
    txt.textContent = `締め切りまで残り ${remaining} 日（${now.getMonth()+1}月${CONFIG.DEADLINE_DAY}日まで）`;
    banner.className = 'deadline-banner deadline-ok';
  }

  await loadMyReqs();
  renderEmpCal();
  renderSummary();
  document.getElementById('emp-note').value = S.myNote || '';
}

// 申請とコメントをまとめて読む
async function loadMyReqs() {
  const { data } = await S.sb.rpc('nurse_my_month', {
    p_id: S.user.employee_id, p_hash: S.hash, p_year: S.reqYear, p_month: S.reqMonth });
  S.myReqs = {}; S.myNote = '';
  if (data) {
    (data.requests || []).forEach(r => { S.myReqs[r.day] = r; });
    S.myNote = data.note || '';
  }
}

function renderSummary() {
  const reqs = Object.values(S.myReqs);
  document.getElementById('cnt-nikkin').textContent = reqs.filter(r => r.type === '日勤').length;
  const nYasumi = reqs.filter(r => r.type === '休み').length;
  const elY = document.getElementById('cnt-yasumi');
  elY.textContent = nYasumi;
  const elMax = document.getElementById('cnt-yasumi-max');
  if (elMax) elMax.textContent = `（${KIBOU_MAX}日まで）`;
  // 上限を超えていたら色で知らせる
  elY.style.color = nYasumi > KIBOU_MAX ? '#B45309' : '';
  const note = document.getElementById('kibou-note');
  if (note) {
    note.textContent = nYasumi > KIBOU_MAX
      ? `希望休が${nYasumi}日です。${KIBOU_MAX}日を超えているので、管理者への連絡をお願いします。`
      : `希望休（「休み」）は月${KIBOU_MAX}日までです。${KIBOU_MAX}日を超えるときは管理者へご連絡ください。有給と日勤はこの数に入りません。`;
    note.style.background = nYasumi > KIBOU_MAX ? '#FEF3C7' : '#F3F4F6';
    note.style.color      = nYasumi > KIBOU_MAX ? '#92400E' : '#4B5563';
  }
  document.getElementById('cnt-yukyu').textContent  = reqs.filter(r => r.type === '有給').length;
}

function renderEmpCal() {
  const y = S.reqYear, m = S.reqMonth;
  const days = new Date(y, m, 0).getDate();
  const first = new Date(y, m-1, 1).getDay();
  const today = new Date();
  let html = '<div class="cal-grid">';
  JA_DOW.forEach(d => { html += `<div class="cal-hdr">${d}</div>`; });
  for (let i=0; i<first; i++) html += '<div class="cal-cell empty"></div>';
  for (let d=1; d<=days; d++) {
    const dow = new Date(y, m-1, d).getDay();
    const isToday = y===today.getFullYear() && m===today.getMonth()+1 && d===today.getDate();
    let cls = 'cal-cell';
    if (dow===0) cls+=' sun'; if (dow===6) cls+=' sat'; if (isToday) cls+=' today';
    const r = S.myReqs[d];
    const chip = r ? `<span class="type-chip ${TYPE_CHIP[r.type]}">${r.type}</span>` : '';
    html += `<div class="${cls}" onclick="openDayModal(${d})">
      <span class="day-num">${d}</span>${chip}
    </div>`;
  }
  html += '</div>';
  document.getElementById('emp-calendar').innerHTML = html;
}

function openDayModal(day) {
  const date = new Date(S.reqYear, S.reqMonth-1, day);
  const dow = JA_DOW[date.getDay()];
  const r = S.myReqs[day];
  const deadline = isDeadlinePassed();

  const types = ['日勤','休み','有給'];
  const btns = types.map(t => {
    const active = r && r.type === t ? 'active' : '';
    const cls = t === '日勤' ? 'sel-nikkin' : t === '休み' ? 'sel-yasumi' : 'sel-yukyu';
    const onclick = deadline ? '' : `onclick="selectType(${day}, '${t}')"`;
    const disabled = deadline ? 'disabled' : '';
    return `<button class="type-sel-btn ${cls} ${active}" ${onclick} ${disabled}>${t}</button>`;
  }).join('');

  const cancelBtn = r && !deadline
    ? `<button class="btn btn-outline" style="color:#EF4444;border-color:#EF4444" onclick="cancelReq(${day})">申請を取消</button>`
    : '';

  openModal(`
    <div class="modal-hdr">
      <h3>${S.reqMonth}月${day}日（${dow}）</h3>
      <p>${r ? `現在: ${r.type}` : '未登録'}</p>
    </div>
    <div class="modal-body">
      ${deadline ? '<div style="padding:10px;background:#FEF3C7;border-radius:8px;font-size:13px;color:#92400E;margin-bottom:12px">締め切りを過ぎているため変更できません</div>' : ''}
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">種別を選択</div>
      <div class="type-sel-grid">${btns}</div>
    </div>
    <div class="modal-foot">${cancelBtn}<button class="btn btn-outline" onclick="closeModal()">閉じる</button></div>
  `);
}

async function selectType(day, type) {
  if (isDeadlinePassed()) { toast('締め切りを過ぎています'); return; }
  // 希望休が上限を超えるときは、管理者へ連絡したかを確かめてから登録する
  if (type === '休み') {
    const already = Object.values(S.myReqs)
      .filter(r => r.type === '休み' && Number(r.day) !== Number(day)).length;
    if (already >= KIBOU_MAX) {
      const ok = confirm(
        `希望休は月${KIBOU_MAX}日までです。この日を入れると${already + 1}日になります。\n\n`
        + `${KIBOU_MAX}日を超える場合は、管理者への連絡が必要です。\n`
        + `連絡済みであれば「OK」を押してください。`);
      if (!ok) return;
    }
  }
  const { data: res, error } = await S.sb.rpc('nurse_set_request', {
    p_id: S.user.employee_id, p_hash: S.hash,
    p_year: S.reqYear, p_month: S.reqMonth, p_day: day, p_type: type });
  if (error || res !== 'ok') { toast('エラーが発生しました'); return; }
  S.myReqs[day] = { day, type, status: 'pending' };
  renderEmpCal(); renderSummary();
  closeModal();
  toast(`${S.reqMonth}月${day}日：${type} を登録しました`);
}

async function cancelReq(day) {
  if (isDeadlinePassed()) { toast('締め切りを過ぎています'); closeModal(); return; }
  const r = S.myReqs[day];
  if (!r) return;
  const { data: res, error } = await S.sb.rpc('nurse_cancel_request', {
    p_id: S.user.employee_id, p_hash: S.hash,
    p_year: S.reqYear, p_month: S.reqMonth, p_day: day });
  if (error || res !== 'ok') { toast('エラーが発生しました'); return; }
  delete S.myReqs[day];
  renderEmpCal(); renderSummary();
  closeModal();
  toast(`${S.reqMonth}月${day}日の申請を取消しました`);
}

async function saveNote() {
  const note = document.getElementById('emp-note').value;
  const { data: res, error } = await S.sb.rpc('nurse_set_note', {
    p_id: S.user.employee_id, p_hash: S.hash,
    p_year: S.reqYear, p_month: S.reqMonth, p_note: note });
  if (error || res !== 'ok') { toast('エラーが発生しました'); return; }
  S.myNote = note;
  toast('コメントを保存しました');
}

// ── Admin View ─────────────────────────────
async function showAdminView() {
  showPage('page-admin');
  document.getElementById('admin-hdr-sub').textContent = `${S.user.name}（管理者）`;
  const now = new Date();
  S.adminYear = now.getMonth() === 11 ? now.getFullYear()+1 : now.getFullYear();
  S.adminMonth = now.getMonth() === 11 ? 1 : now.getMonth()+2;
  await loadAllReqs();
  renderAdminCal();
}

async function loadAllReqs() {
  // S.viewFacility は Halcyon から「この事業所を見たい」と渡されたときに入る。
  // 担当が決まっている管理者には効かない（サーバー側で無視される）。
  const { data: all } = await S.sb.rpc('nurse_admin_month', {
    p_id: S.user.employee_id, p_hash: S.hash,
    p_year: S.adminYear, p_month: S.adminMonth,
    p_view: S.viewFacility || null });
  // 見出しは、実際にしぼり込まれた事業所に合わせる
  const t = document.getElementById('admin-hdr-title');
  if (t) t.textContent = all && all.facility
    ? `管理者ダッシュボード（${all.facility}）` : '管理者ダッシュボード（全事業所）';
  const reqRes  = { data: all?.requests  || [] };
  const empRes  = { data: all?.employees || [] };
  const noteRes = { data: all?.notes     || [] };
  const empList = (empRes.data || []).filter(e => !e.is_admin);
  empList.forEach((e, i) => { e._color = COLORS[i % COLORS.length]; });
  S.employees = empList;
  const empMap = {};
  empList.forEach(e => { empMap[e.employee_id] = e; });

  S.allReqs = {};
  (reqRes.data || []).forEach(r => {
    if (!S.allReqs[r.day]) S.allReqs[r.day] = [];
    const emp = empMap[r.employee_id];
    S.allReqs[r.day].push({ ...r, name: emp?.name || r.employee_id, color: emp?._color || '#888' });
  });
  S.allNotes = {};
  (noteRes.data || []).forEach(n => {
    const emp = S.employees.find(e => e.employee_id === n.employee_id);
    S.allNotes[n.employee_id] = { note: n.note, name: emp?.name || n.employee_id };
  });
  renderAdminNotes();
  renderEmpTable();
}

/* 職員ごとの希望休の数。上限を超えている人が一目で分かるようにする */
function renderKibouTally() {
  const host = document.getElementById('admin-notes-list');
  if (!host) return;
  let box = document.getElementById('kibou-tally');
  if (!box) {
    box = document.createElement('div');
    box.id = 'kibou-tally';
    box.style.cssText = 'margin:0 0 14px;padding:12px;border:1px solid var(--border);border-radius:8px;background:#FAFAFA';
    host.parentNode.insertBefore(box, host);
  }
  const cnt = {};
  Object.values(S.allReqs).flat().forEach(r => {
    if (r.type !== '休み') return;
    cnt[r.employee_id] = (cnt[r.employee_id] || 0) + 1;
  });
  const rows = S.employees.map(e => {
    const n = cnt[e.employee_id] || 0;
    const over = n > KIBOU_MAX;
    return `<div style="display:flex;align-items:center;gap:8px;padding:4px 0">
      <div class="emp-dot" style="background:${e._color}">${e.name[0]}</div>
      <div style="flex:1">${e.name}</div>
      <div style="font-weight:700;color:${over ? '#B45309' : '#374151'}">${n}日${over ? '　⚠ 要連絡' : ''}</div>
    </div>`;
  }).join('');
  box.innerHTML = `<div style="font-size:12px;color:var(--muted);margin-bottom:6px">
      今月の希望休（上限 ${KIBOU_MAX}日／超えた人は本人からの連絡が必要です）</div>${rows}`;
}

function renderAdminNotes() {
  renderKibouTally();
  const el = document.getElementById('admin-notes-list');
  const entries = Object.entries(S.allNotes).filter(([,v]) => v.note && v.note.trim());
  if (!entries.length) { el.innerHTML = '<span style="color:var(--muted)">コメントはありません</span>'; return; }
  el.innerHTML = entries.map(([,v]) => `
    <div style="border-bottom:1px solid var(--border);padding:10px 0">
      <div style="font-weight:600;margin-bottom:4px;color:#1E3A5F">${v.name}</div>
      <div style="white-space:pre-wrap;line-height:1.7">${v.note}</div>
    </div>`).join('');
}

function renderAdminCal() {
  document.getElementById('admin-month-label').textContent = `${S.adminYear}年${S.adminMonth}月`;
  document.getElementById('admin-legend').innerHTML =
    S.employees.map(e => `<div class="leg-item"><div class="emp-dot" style="background:${e._color}">${e.name[0]}</div>${e.name}</div>`).join('') +
    `<div class="leg-item" style="margin-left:auto">
      <div class="leg-dot" style="background:var(--nikkin)"></div>日勤
      <div class="leg-dot" style="background:var(--yasumi);margin-left:6px"></div>休み
      <div class="leg-dot" style="background:var(--yukyu);margin-left:6px"></div>有給
    </div>`;

  const y = S.adminYear, m = S.adminMonth;
  const days = new Date(y, m, 0).getDate();
  const first = new Date(y, m-1, 1).getDay();
  const today = new Date();
  let html = '<div class="cal-grid">';
  JA_DOW.forEach(d => { html += `<div class="cal-hdr">${d}</div>`; });
  for (let i=0; i<first; i++) html += '<div class="cal-cell empty"></div>';
  for (let d=1; d<=days; d++) {
    const dow = new Date(y, m-1, d).getDay();
    const isToday = y===today.getFullYear() && m===today.getMonth()+1 && d===today.getDate();
    let cls = 'cal-cell';
    if (dow===0) cls+=' sun'; if (dow===6) cls+=' sat'; if (isToday) cls+=' today';
    const reqs = S.allReqs[d] || [];
    const dots = reqs.map(r => {
      const bdr = r.type==='日勤'?`outline:2px solid var(--nikkin)`:r.type==='休み'?`outline:2px solid var(--yasumi)`:`outline:2px solid var(--yukyu)`;
      return `<div class="emp-dot" style="background:${r.color};${bdr};width:20px;height:20px;font-size:9px" title="${r.name}：${r.type}">${r.name[0]}</div>`;
    }).join('');
    const cnt = reqs.length > 0 ? `<div style="font-size:9px;color:var(--muted)">${reqs.length}件</div>` : '';
    html += `<div class="${cls}" onclick="openAdminDayModal(${d})">
      <span class="day-num">${d}</span>
      ${dots ? `<div style="display:flex;flex-wrap:wrap;gap:2px">${dots}</div>` : ''}
      ${cnt}
    </div>`;
  }
  html += '</div>';
  document.getElementById('admin-calendar').innerHTML = html;
}

function openAdminDayModal(day) {
  const reqs = S.allReqs[day] || [];
  const date = new Date(S.adminYear, S.adminMonth-1, day);
  if (reqs.length === 0) { toast('この日の申請はありません'); return; }
  const list = reqs.map(r => {
    const cc = TYPE_CHIP[r.type] || 'chip-yasumi';
    const stBadge = r.status === 'approved'
      ? '<span style="font-size:11px;padding:2px 7px;border-radius:99px;background:#D1FAE5;color:#065F46;font-weight:700">✅ 確認済</span>'
      : '<span style="font-size:11px;padding:2px 7px;border-radius:99px;background:#FEF9C3;color:#92400E;font-weight:700">⏳ 未確認</span>';
    const btn = r.status !== 'approved'
      ? `<button class="btn" style="font-size:12px;padding:4px 10px;background:#10B981;color:#fff;min-height:0;width:auto" onclick="confirmReq('${r.id}')">確認済にする</button>` : '';
    return `<li style="display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap">
      <div class="emp-dot" style="background:${r.color}">${r.name[0]}</div>
      <div style="flex:1;min-width:0"><div style="font-weight:600">${r.name}</div></div>
      <span class="type-chip ${cc}" style="display:inline-block">${r.type}</span>
      ${stBadge}
      ${btn}
    </li>`;
  }).join('');
  openModal(`
    <div class="modal-hdr"><h3>${S.adminMonth}月${day}日（${JA_DOW[date.getDay()]}）</h3><p>申請 ${reqs.length}件</p></div>
    <div class="modal-body"><ul style="list-style:none">${list}</ul></div>
    <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">閉じる</button></div>
  `);
}

async function confirmReq(id) {
  const { data: res, error } = await S.sb.rpc('nurse_admin_approve', {
    p_id: S.user.employee_id, p_hash: S.hash, p_req_id: id });
  if (error || res !== 'ok') { toast('エラーが発生しました'); return; }
  Object.values(S.allReqs).forEach(reqs => {
    const r = reqs.find(r => r.id === id);
    if (r) r.status = 'approved';
  });
  renderAdminCal();
  closeModal();
  toast('確認済にしました');
}

async function changeMonth(delta) {
  S.adminMonth += delta;
  if (S.adminMonth > 12) { S.adminYear++; S.adminMonth = 1; }
  if (S.adminMonth < 1) { S.adminYear--; S.adminMonth = 12; }
  document.getElementById('admin-calendar').innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)"><div class="spinner" style="margin:0 auto 12px"></div>読み込み中...</div>';
  await loadAllReqs();
  renderAdminCal();
}

function switchTab(tab) {
  ['cal','emp','account'].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
    document.getElementById(`content-${t}`).classList.toggle('hidden', t !== tab);
  });
}

// Employee management
function renderEmpTable() {
  const emps = S.employees;
  if (!emps.length) { document.getElementById('emp-table-wrap').innerHTML = '<p style="padding:16px;color:var(--muted)">職員がいません</p>'; return; }
  const rows = emps.map(e => `<tr>
    <td>${e.employee_id}</td>
    <td style="font-weight:600">${e.name}</td>
    <td><span style="font-size:11px;padding:2px 8px;border-radius:99px;background:#ECFDF5;color:#065F46">${e.role || '職員'}</span></td>
    <td style="font-family:monospace;font-size:14px;letter-spacing:.05em;color:#134E4A;font-weight:700">${e.plain_password || '—'}</td>
    <td><button style="font-size:11px;padding:4px 10px;border:1px solid #FECACA;border-radius:6px;background:#FEF2F2;color:#EF4444;cursor:pointer" onclick="deactivateEmp('${e.employee_id}')">削除</button></td>
  </tr>`).join('');
  document.getElementById('emp-table-wrap').innerHTML = `<table class="emp-table">
    <thead><tr><th>ID</th><th>氏名</th><th>役職</th><th>パスワード</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function toggleAddForm() {
  S.addFormOpen = !S.addFormOpen;
  document.getElementById('add-emp-form').classList.toggle('hidden', !S.addFormOpen);
}

async function addEmployee() {
  const id = document.getElementById('ne-id').value.trim().toUpperCase();
  const name = document.getElementById('ne-name').value.trim();
  const pw = document.getElementById('ne-pw').value;
  if (!id || !name || pw.length < 4) { toast('すべて入力してください（PW4文字以上）'); return; }
  if (!id.startsWith(CONFIG.SYSTEM_PREFIX)) { toast(`IDは ${CONFIG.SYSTEM_PREFIX} から始まる必要があります`); return; }
  const hash = await sha256(pw);
  const { data: res, error } = await S.sb.rpc('nurse_admin_add', {
    p_id: S.user.employee_id, p_hash: S.hash,
    p_new_id: id, p_new_hash: hash, p_name: name });
  if (error || res !== 'ok') {
    toast(res === 'exists' ? 'このIDは既に使われています'
        : 'エラー: ' + (error?.message || '追加できませんでした')); return;
  }
  toast(`${name} を追加しました`);
  document.getElementById('ne-id').value = '';
  document.getElementById('ne-name').value = '';
  document.getElementById('ne-pw').value = '';
  toggleAddForm();
  await loadAllReqs();
  renderAdminCal();
}

async function deactivateEmp(id) {
  if (!confirm('この職員を削除しますか？')) return;
  const { data: res } = await S.sb.rpc('nurse_admin_deactivate', {
    p_id: S.user.employee_id, p_hash: S.hash, p_target: id });
  if (res !== 'ok') { toast(res === 'self' ? '自分は削除できません' : 'エラーが発生しました'); return; }
  toast('削除しました');
  await loadAllReqs();
  renderAdminCal();
}

async function changeAdminPassword() {
  const cur = document.getElementById('adm-pw-cur').value;
  const nw  = document.getElementById('adm-pw-new').value;
  const nw2 = document.getElementById('adm-pw-new2').value;
  const errEl = document.getElementById('adm-pw-err');
  errEl.style.display = 'none';
  if (nw !== nw2) { errEl.textContent = '新しいパスワードが一致しません'; errEl.style.display = 'block'; return; }
  if (nw.length < 4) { errEl.textContent = 'パスワードは4文字以上'; errEl.style.display = 'block'; return; }
  const curHash = await sha256(cur);
  const newHash = await sha256(nw);
  const { data: res, error } = await S.sb.rpc('nurse_change_password', {
    p_id: S.user.employee_id, p_old: curHash, p_new: newHash });
  if (error || res !== 'ok') {
    errEl.textContent = res === 'auth' ? '現在のパスワードが違います' : 'エラーが発生しました';
    errEl.style.display = 'block'; return;
  }
  S.hash = newHash;
  toast('パスワードを変更しました');
  ['adm-pw-cur','adm-pw-new','adm-pw-new2'].forEach(id => { document.getElementById(id).value = ''; });
}

// ── Print ─────────────────────────────────
function printMonthlySummary() {
  const y = S.adminYear, m = S.adminMonth;
  const days = new Date(y, m, 0).getDate();
  const emps = S.employees;
  if (emps.length === 0) { toast('職員データがありません'); return; }

  const DOW = ['日','月','火','水','木','金','土'];
  const TYPE_COLOR_P = { '日勤':'#2563EB', '休み':'#6B7280', '有給':'#10B981' };
  const TYPE_LABEL_P = { '日勤':'日勤', '休み':'休み', '有給':'有給' };

  const grid = {};
  emps.forEach(e => { grid[e.employee_id] = {}; });
  Object.entries(S.allReqs).forEach(([day, reqs]) => {
    reqs.forEach(r => {
      if (grid[r.employee_id] !== undefined) grid[r.employee_id][day] = r;
    });
  });

  const dayHeaders = Array.from({length: days}, (_, i) => i+1);
  const thBase = 'border:1px solid #bbb;padding:2px 1px;text-align:center;font-size:8px;background:#134E4A;color:#fff;font-weight:700';
  const dayThs = dayHeaders.map(d => {
    const dow = new Date(y, m-1, d).getDay();
    const c = dow===0?'#FCA5A5':dow===6?'#93C5FD':'#fff';
    return `<th style="${thBase};color:${c};min-width:18px"><div>${d}</div><div style="font-size:7px">${DOW[dow]}</div></th>`;
  }).join('');

  const rows = emps.map(e => {
    const cells = dayHeaders.map(d => {
      const r = grid[e.employee_id][d];
      if (!r) {
        const dow = new Date(y, m-1, d).getDay();
        const bg = dow===0?'#FFF0F0':dow===6?'#F0F4FF':'#fff';
        return `<td style="border:1px solid #ddd;background:${bg}"></td>`;
      }
      const bg = TYPE_COLOR_P[r.type] || '#888';
      return `<td style="border:1px solid #bbb;background:${bg};color:#fff;font-weight:700;text-align:center;font-size:8px;padding:1px">${TYPE_LABEL_P[r.type] || r.type}</td>`;
    }).join('');
    return `<tr>
      <td style="border:1px solid #bbb;padding:2px 6px;white-space:nowrap;font-size:9px;background:#F8FAFC;font-weight:700">${e.name}</td>${cells}
    </tr>`;
  }).join('');

  const totals = dayHeaders.map(d => {
    const cnt = (S.allReqs[d] || []).length;
    return `<td style="border:1px solid #bbb;text-align:center;font-size:8px;background:#F1F5F9;font-weight:700">${cnt > 0 ? cnt : ''}</td>`;
  }).join('');

  const notes = Object.entries(S.allNotes).filter(([,v]) => v.note && v.note.trim());
  const notesHtml = notes.length > 0 ? `
    <div style="margin-top:10px;border-top:2px solid #333;padding-top:6px">
      <div style="font-size:10px;font-weight:700;margin-bottom:4px">【特記事項】</div>
      ${notes.map(([,v]) => `<div style="font-size:9px;margin-bottom:3px;padding:4px 6px;background:#FFFBEB;border-left:3px solid #F59E0B">
        <span style="font-weight:700">${v.name}：</span>${v.note.replace(/\n/g,' ')}
      </div>`).join('')}
    </div>` : '';

  const legend = Object.entries(TYPE_LABEL_P).map(([type, lbl]) =>
    `<div style="display:flex;align-items:center;gap:3px">
      <div style="width:12px;height:12px;background:${TYPE_COLOR_P[type]};border-radius:2px"></div>
      <span>${lbl}</span>
    </div>`).join('');

  const html = `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
    <title>${y}年${m}月 シフト希望一覧</title>
    <style>
      @page { size: A4 landscape; margin: 8mm; }
      *{box-sizing:border-box;margin:0;padding:0}
      body{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;font-size:9px}
      table{border-collapse:collapse;width:100%}
    </style>
  </head><body>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px">
      <div>
        <div style="font-size:14px;font-weight:700">${S.user.facility || S.viewFacility || '全事業所'}　${y}年${m}月　シフト希望一覧</div>
        <div style="font-size:8px;color:#666;margin-top:2px">医療法人いなだ医院　メディケアビレッジ　／　印刷日：${new Date().toLocaleDateString('ja-JP')}</div>
      </div>
      <div style="display:flex;gap:10px;font-size:8px">${legend}</div>
    </div>
    <table>
      <thead><tr>
        <th style="${thBase};min-width:64px;text-align:left;padding:4px">氏名</th>${dayThs}
      </tr></thead>
      <tbody>
        ${rows}
        <tr>
          <td style="border:1px solid #bbb;padding:2px 4px;font-size:8px;font-weight:700;background:#F1F5F9;text-align:right">件数</td>${totals}
        </tr>
      </tbody>
    </table>
    ${notesHtml}
    <script>window.onload=function(){window.print();}<\/script>
  </body></html>`;

  const w = window.open('', '_blank');
  w.document.write(html);
  w.document.close();
}
</script>
</body>
